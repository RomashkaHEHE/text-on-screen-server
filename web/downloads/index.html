<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Скачать Text on Screen</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><p class="eyebrow">TEXT ON SCREEN</p><h1>Скачать приложение</h1><p class="lead">Установщик для Windows и актуальная версия протокола.</p><div class="card"><p id="state">Загружаем информацию о релизе…</p><a id="download" class="button" hidden>Скачать установщик</a></div></main><script type="module">const state=document.querySelector('#state'),link=document.querySelector('#download');try{const r=await fetch('/api/v1/releases/latest');if(!r.ok)throw new Error();const data=await r.json();const asset=data.platforms?.['windows-x86_64'];if(!asset?.url)throw new Error();link.href=asset.url.startsWith('http')?asset.url:asset.url;link.hidden=false;state.textContent=`Версия ${data.version} для Windows x64`; }catch{state.textContent='Стабильный установщик пока не опубликован.'}</script></body></html>
